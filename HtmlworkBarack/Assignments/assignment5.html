<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
</head>
<body>
    <h1><b>IT CONSULTANT APPLICATION FORM</b></h1><br>
    <h4>Please make sure you fill in the form below*</h4><br>
    <form>
        <fieldset>
            <legend>CONTACT DETAILS</legend>
            <input type="text" name="Name" id="Name" placeholder="Enter Name"><br><br>
            <input type="tel" name="Phone number" id="Phone Number" placeholder="Enter Telephone Number"><br><br>
            <input type="email" name="email" id="email" placeholder="Enter Email"><br><br>
        </fieldset><br><br>

        <fieldset>
            <legend>PERSONAL DETAILS</legend>
            <input type="number" name="Age" id="Age" placeholder="Your Age"><br><br>
            <label for="Gender">Gender</label><br>
            <select name="Gender" id="Gender">
                <option value="M">Male</option>
                <option value="F">Female</option>
                <option value="NA">Rather Not Say</option>
            </select><br><br>
            <label for="Motivation">What gave you the motivation to apply</label><br>
            <textarea name="Motivation" id="Motivation" cols="30" rows="10"></textarea>
        </fieldset><br><br>

        <fieldset>
            <Legend>PICK YOUR FAVOURITE LANGUAGE</Legend>
            <input type="checkbox" name="language" id="language" value="JAVA">JAVA &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="checkbox" name="language" id="language" value="HTML">HTML &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="checkbox" name="language" id="language" value="SQL">SQL 
        </fieldset><br><br>

        <input type="submit" name="" id="" value="SUMBIT FORM">
    </form>
</body>
</html>
