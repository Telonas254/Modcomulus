<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN </title>
</head>
<body>
    {%include 'navbar.html'%}
    <br>
    <div class="container">
        <h5 class="text-primary">{{message}}</h5>
        <h5 class="text-danger">{{warning}}</h5>
        <h5 class="text-success">{{success}}</h5>
        <section class="row">
            <div class="col-md-6 card shadow pt-2 pb-2">
                <form action="/login" method="post" enctype="multipart/form-data">
                    <input type="text" name="user_name" placeholder="Enter Username" class="form-control">
                    <br>
                    <input type="password" name="password" placeholder="Enter password" class="form-control">
                    <br>
                    <input type="submit" value="Login Here" class="btn btn-primary">
                </form>

            </div>

        </section>
        <br>
        <h5><a href="/login">Don't Have An Account?</a></h5>

    </div>
    <br>

    {%include 'footer.html'%}
    
</body>
</html>
